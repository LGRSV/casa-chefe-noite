name: Blender
description: Instala o Blender 4.5.16 Linux x64 (com cache)
runs:
  using: composite
  steps:
    - name: Bibliotecas do sistema
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6 libxkbcommon0 libegl1 libxext6 xz-utils
    - uses: actions/cache@v4
      id: cache
      with:
        path: ~/blender
        key: blender-4.5.16-linux-x64
    - name: Baixar Blender
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/blender
        curl -fsSL --retry 5 https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz | tar -xJ -C ~/blender --strip-components=1
    - name: PATH
      shell: bash
      run: |
        echo "$HOME/blender" >> "$GITHUB_PATH"
        ~/blender/blender --version | head -1
